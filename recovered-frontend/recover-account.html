<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <title>Reset your password · NU Dashboard</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/src/pages/email-code-recovery/recovery.css">
</head>
<body>
  <main>
    <p class="brand">NU Dental <span>Practice Management Portal</span></p>
    <h1 id="heading" tabindex="-1">Reset your password</h1>
    <noscript>Turn on JavaScript to reset your password.</noscript>
    <form id="verify" hidden>
      <p>Enter your work email and the code from your most recent password reset email.</p>
      <label for="email">Work email</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="code">Email code</label>
      <input id="code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6,10}" maxlength="10" required>
      <button type="submit">Verify code</button>
      <button class="text" id="resend" type="button">Send me a new code</button>
    </form>
    <form id="change" hidden>
      <p id="identity"></p>
      <label for="password">New password</label>
      <input type="password" id="password" autocomplete="new-password" aria-describedby="policy" required>
      <p id="policy" class="hint"></p>
      <label for="confirm">Confirm new password</label>
      <input type="password" id="confirm" autocomplete="new-password" required>
      <button type="submit">Save new password</button>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
    <p class="return"><a href="/login">Go to sign in</a></p>
  </main>
  <script type="module" src="/src/pages/email-code-recovery/recovery.js"></script>
</body>
</html>
